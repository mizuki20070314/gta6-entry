<!doctype html>
<!-- Pacificora runs entirely from local classic scripts. -->
<!-- Keep this sequence aligned with the globals each stage provides. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SUNSET COAST</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; margin: 0; overflow: hidden;
        background: #171724; font-family: Arial, sans-serif;
      }
      body { display: grid; place-items: center; }
      #game { display: block; max-width: 100vw; max-height: 100vh; }
    </style>
  </head>
  <body>
    <canvas id="game" width="1280" height="720" aria-label="SUNSET COAST game"></canvas>
    <script src="src/config.js"></script>
    <script src="src/rng.js"></script>
    <script src="src/city.js"></script>
    <script src="src/player.js"></script>
    <script src="src/vehicles.js"></script>
    <script src="src/pedestrians.js"></script>
    <script src="src/effects.js"></script>
    <script src="src/audio.js"></script>
    <script src="src/police.js"></script>
    <script src="src/missions.js"></script>
    <script src="src/hud.js"></script>
    <script src="src/save.js"></script>
    <script src="src/menus.js"></script>
    <script src="src/game.js"></script>
    <script src="src/shots.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
